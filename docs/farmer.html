<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아까시 개화·작황 예보</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap');
:root{--honey:#E8A317;--honey-deep:#C77B0E;--comb:#F6E6B4;--ink:#2B2118;--paper:#FBF6EA;--card:#FFF;--good:#3C8A5A;--warn:#D98324;--bad:#C0392B;--line:#E5D9BC;--muted:#8A7A5C}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans KR',sans-serif;background:var(--paper);color:var(--ink);line-height:1.55}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 70px}
header{padding:24px 0 16px;border-bottom:3px solid var(--ink);position:relative;overflow:hidden}
header .hex{position:absolute;right:-15px;top:-8px;font-size:110px;color:var(--comb);z-index:0}
header h1{font-family:'Black Han Sans';font-size:clamp(24px,5vw,38px);letter-spacing:-1px;z-index:1;position:relative}
header h1 em{font-style:normal;color:var(--honey-deep)}
header p{font-family:'Gowun Dodum';color:var(--muted);margin-top:4px;position:relative;z-index:1;font-size:14px}
.meta{font-size:12px;color:var(--muted);margin-top:6px;position:relative;z-index:1}
.topbar{display:flex;gap:8px;align-items:center;position:relative;z-index:1;margin-bottom:8px;flex-wrap:wrap}
.topbar a{font-size:12.5px;color:var(--muted);text-decoration:none;font-weight:700}
.topbar select{padding:6px 9px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:12.5px;background:#fff;font-weight:700;margin-left:auto}
.lang{border:1px solid var(--ink);border-radius:8px;overflow:hidden;display:flex}
.lang button{border:none;background:#fff;padding:6px 10px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
.lang button.on{background:var(--ink);color:var(--paper)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.panel h2{font-size:13px;font-weight:700;color:var(--muted);padding:14px 18px 0}
#map{height:380px;width:100%;margin-top:10px;border-top:1px solid var(--line)}
.locate{margin:14px 18px;width:calc(100% - 36px);padding:13px;border:none;border-radius:10px;background:var(--ink);color:var(--paper);font-family:'IBM Plex Sans KR';font-weight:700;font-size:15px;cursor:pointer}
.locate:hover{background:var(--honey-deep)}
.empty{padding:44px 24px;text-align:center;color:var(--muted);font-family:'Gowun Dodum'}
.empty .big{font-size:40px;margin-bottom:8px}
.diag{padding:18px}
.locrow{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.locrow .pin{font-size:24px}
.locrow .st{font-size:12px;color:var(--honey-deep);font-weight:700}
.locrow .nm{font-family:'Gowun Dodum';font-size:16px}
.bloom{background:var(--comb);border-radius:12px;padding:14px;margin-top:13px;text-align:center}
.bloom .lab{font-size:12px;color:var(--honey-deep);font-weight:700}
.bloom .date{font-family:'Black Han Sans';font-size:30px;margin-top:2px}
.idxbox{margin-top:13px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px}
.idxbox .lab{font-size:12px;color:var(--muted);font-weight:700}
.idxrow{display:flex;align-items:baseline;gap:8px;margin-top:4px}
.idxrow .val{font-family:'Black Han Sans';font-size:34px}
.idxrow .band{font-weight:700;font-size:14px}
.bar{height:10px;border-radius:5px;background:#EEE4C8;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px}
.advice{margin-top:12px;background:#FFF9E8;border:1px solid var(--comb);border-left:4px solid var(--honey-deep);border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.65}
.advice .t{font-size:11.5px;font-weight:700;color:var(--honey-deep);margin-bottom:3px}
.twin{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.gbox{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.gbox .lab{font-size:11.5px;color:var(--muted);font-weight:700}
.gbox .v{font-family:'Black Han Sans';font-size:26px;margin-top:2px}
.slots{padding:14px 18px 18px}
.slotadd{display:flex;gap:8px;margin-bottom:12px}
.slotadd select{flex:1;padding:10px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:14px;background:#fff}
.slotadd button{padding:10px 16px;border:none;border-radius:9px;background:var(--honey-deep);color:#fff;font-weight:700;cursor:pointer;font-family:inherit}
.scard{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:9px;display:flex;align-items:center;gap:11px;background:var(--paper)}
.scard .dot{width:13px;height:13px;border-radius:50%;flex:none}
.scard .n{font-weight:700;min-width:56px}
.scard .d{font-size:13px;color:var(--muted);flex:1}
.scard .g{font-family:'Black Han Sans';font-size:19px}
.scard .x{border:none;background:none;color:var(--muted);cursor:pointer;font-size:16px}
footer{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);font-family:'Gowun Dodum';line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="hex">⬡</div>
  <div class="topbar">
    <a href="index.html" id="goAdmin"></a>
    <select id="yearSel"></select>
    <div class="lang">
      <button id="btnKo" onclick="setLang('ko')">한국어</button>
      <button id="btnEn" onclick="setLang('en')">EN</button>
    </div>
  </div>
  <h1 id="ttl"></h1>
  <p id="sub"></p>
  <div class="meta" id="meta"></div>
</header>

<div class="grid">
  <div class="panel">
    <h2 id="hMap"></h2>
    <div id="map"></div>
    <button class="locate" id="btnLoc" onclick="locateMe()"></button>
  </div>
  <div>
    <div class="panel">
      <h2 id="hDiag"></h2>
      <div class="empty" id="emptyDiag"><div class="big">🐝</div><span id="emptyTxt"></span></div>
      <div class="diag" id="diag" style="display:none"></div>
    </div>
    <div class="panel" style="margin-top:18px">
      <h2 id="hSlots"></h2>
      <div class="slots">
        <div class="slotadd">
          <select id="slotSel"></select>
          <button onclick="addSlot()" id="btnAdd"></button>
        </div>
        <div id="slotList"></div>
      </div>
    </div>
  </div>
</div>

<footer id="foot"></footer>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const REPO='https://raw.githubusercontent.com/Karl7208/bee_honey_climate/main/docs';
const Y0=1990,Y1=2026;
const S={
ko:{admin:'← 전국 관제',ttl:'아까시 <em>개화·작황</em> 예보',
 sub:'기상 기반 개화 시기와 꿀 생산 여건을 지점별로 진단합니다',
 hMap:'지도에서 보기',loc:'📍 내 위치 진단',hDiag:'지점 진단',
 empty:'지도의 지점을 누르거나<br>내 위치 진단을 실행하세요',
 hSlots:'이동양봉 비교 (최대 4곳)',pick:'지점 선택…',add:'추가',
 slotHint:'이동 후보 지점을 추가해 개화·여건을 나란히 비교하세요',
 site:'진단 지점',obsKm:d=>` · 관측 ${d}km`,bloomLab:'예상 개화일',
 bloomLabPast:'개화일(추정)',idxLab:'꿀 생산 여건 지수 (0~1)',
 grLab:'품질 등급',obsLab:'관측 반영일',days:'일',
 gl:{A:'프리미엄',B:'우수',C:'양호',D:'보통',E:'주의'},
 tl:{GREEN:'좋음',YELLOW:'보통',RED:'주의'},
 live:'실시간(올해)',bloom:d=>`${d.getMonth()+1}월 ${d.getDate()}일`,
 meta:(y,n)=>`${y} 시즌 · ${n}개 지점`,fail:'데이터를 불러오지 못했습니다.',
 noLoc:'위치를 가져오지 못했습니다. 지도에서 지점을 선택하세요.',
 adv:{prep:d=>[`개화 D-${d} · 준비기`,'정리채밀로 사양꿀을 분리하고, 채밀군을 강군 위주로 편성하세요. 저장 공간(계상) 확보를 미리 점검하면 유밀기 대응이 빨라집니다.'],
  red:['유밀기 · 여건 주의','유밀 부진이 우려됩니다. 무리한 채밀보다 봉군 유지에 중점을 두고, 다음 밀원지 이동 계획을 앞당겨 검토하세요.'],
  yel:['유밀기 · 여건 보통','유밀 변동 가능성이 있습니다. 단기 예보를 확인하며 채밀·이동 시기를 조정하고, 강군 위주로 채밀군을 운용하세요.'],
  gab:['유밀기 · 여건 좋음','유밀 여건이 양호합니다. 저장 공간을 확보하고 개화 성기에 채밀을 집중하세요.'],
  gc:['유밀기 · 수분 유의','유밀은 기대되나 꿀 수분이 높아질 수 있습니다. 봉개(숙성) 비율을 확인하고 채밀 간격에 여유를 두세요.'],
  gde:['유밀기 · 고수분 위험','생산 여건은 좋으나 고수분 위험이 있습니다. 봉개 비율을 확인해 숙성 소비 위주로 채밀하고, 채밀 후 농축·저장 관리에 유의하세요.'],
  end:y=>['시즌 종료 · 결과 요약',`이 지점의 ${y}년 아까시 유밀기는 종료되었습니다. 위 지수·등급은 해당 연도 시즌 종합 진단입니다.`],
  hist:y=>[`${y}년 시즌 · 회고 진단`,`${y}년 관측 기상으로 재구성한 시즌 종합 진단입니다. 당시 이 지점에서 위 등급에 해당하는 관리가 적정했음을 의미합니다.`]},
 foot:'연구 기반: 농촌진흥청 양봉 관련 게재 연구(HHWI·HMWI 지수 체계) · 기상자료: 기상청 API허브(ASOS)<br>본 서비스는 연구 시제품이며 기관의 공식 서비스가 아닙니다. 생산 여건 지수(0~1)는 상대적 판단 보조 지표로, 실제 작황·품질을 보증하지 않습니다.'},
en:{admin:'← National dashboard',ttl:'Black Locust <em>Bloom & Honey</em> Outlook',
 sub:'Site-level bloom timing and honey production conditions from weather data',
 hMap:'Map view',loc:'📍 Diagnose my location',hDiag:'Site diagnosis',
 empty:'Tap a station on the map<br>or use location diagnosis',
 hSlots:'Migratory comparison (up to 4)',pick:'Select a site…',add:'Add',
 slotHint:'Add candidate sites to compare bloom timing and conditions side by side',
 site:'Site',obsKm:d=>` · station ${d} km`,bloomLab:'Predicted bloom date',
 bloomLabPast:'Bloom date (est.)',idxLab:'Honey production index (0–1)',
 grLab:'Quality grade',obsLab:'Observed days',days:'days',
 gl:{A:'Premium',B:'Excellent',C:'Good',D:'Fair',E:'Caution'},
 tl:{GREEN:'Good',YELLOW:'Fair',RED:'Alert'},
 live:'Live (this year)',bloom:d=>d.toLocaleDateString('en',{month:'short',day:'numeric'}),
 meta:(y,n)=>`${y} season · ${n} sites`,fail:'Failed to load data.',
 noLoc:'Could not get your location. Please pick a station on the map.',
 adv:{prep:d=>[`Bloom D-${d} · Preparation`,'Separate feed syrup with a cleanup extraction and organize strong colonies for the flow. Check super space in advance for a faster response when the flow starts.'],
  red:['Nectar flow · Alert','Poor flow conditions are likely. Prioritize colony maintenance over forced extraction and consider moving to the next nectar source earlier.'],
  yel:['Nectar flow · Fair','Flow conditions are variable. Watch short-term forecasts to time extraction and moves, and run strong colonies as your extraction units.'],
  gab:['Nectar flow · Good','Flow conditions are favorable. Secure storage space and concentrate extraction at peak bloom.'],
  gc:['Nectar flow · Watch moisture','Good flow expected, but honey moisture may rise. Check capping ratios and allow longer intervals between extractions.'],
  gde:['Nectar flow · High-moisture risk','Yield conditions are good but moisture risk is high. Extract mainly capped (ripened) combs and manage post-harvest drying and storage carefully.'],
  end:y=>['Season complete · Summary',`The ${y} black locust flow at this site has ended. The index and grade above summarize that season.`],
  hist:y=>[`${y} season · Retrospective`,`Reconstructed from observed ${y} weather. The grade above indicates the management level that would have been appropriate at this site that year.`]},
 foot:'Based on published RDA apiculture research (HHWI/HMWI index framework) · Weather: KMA API Hub (ASOS)<br>Research prototype — not an official government service. The 0–1 index is a relative decision aid and does not guarantee actual yield or quality.'}};
const TCOL={GREEN:'#3C8A5A',YELLOW:'#D98324',RED:'#C0392B'};
const GCOL={A:'#3C8A5A',B:'#6FB07F',C:'#E8A317',D:'#D98324',E:'#C0392B'};
let LANG='ko',YEARSEL='live',DATA=null,POINTS={},map,mkLayer,SLOTS=[],CUR=null;

function t(k){return S[LANG][k];}
async function getJSON(rel){
  try{let r=await fetch(rel,{cache:'no-store'});if(r.ok)return await r.json();}catch(e){}
  return await (await fetch(REPO+'/'+rel,{cache:'no-store'})).json();
}
function setLang(l){LANG=l;const u=new URL(location);u.searchParams.set('lang',l);
  history.replaceState(null,'',u);paintStatic();paintMeta();
  if(CUR)showDiag(CUR);renderSlots();}
function paintStatic(){
  document.getElementById('goAdmin').textContent=t('admin');
  document.getElementById('goAdmin').href='index.html'+(LANG==='en'?'?lang=en':'');
  document.getElementById('ttl').innerHTML=t('ttl');
  document.getElementById('sub').textContent=t('sub');
  document.getElementById('hMap').textContent=t('hMap');
  document.getElementById('btnLoc').textContent=t('loc');
  document.getElementById('hDiag').textContent=t('hDiag');
  document.getElementById('emptyTxt').innerHTML=t('empty');
  document.getElementById('hSlots').textContent=t('hSlots');
  document.getElementById('btnAdd').textContent=t('add');
  document.getElementById('foot').innerHTML=t('foot');
  document.getElementById('btnKo').classList.toggle('on',LANG==='ko');
  document.getElementById('btnEn').classList.toggle('on',LANG==='en');
  const ss=document.getElementById('slotSel');
  if(ss.options.length)ss.options[0].textContent=t('pick');
  const ys=document.getElementById('yearSel');
  [...ys.options].forEach(o=>{if(o.value==='live')o.textContent=t('live');});
}
function paintMeta(){
  document.getElementById('meta').textContent=
    S[LANG].meta(META_Y,Object.keys(POINTS).length);
}
let META_Y='';
async function loadYear(sel){
  YEARSEL=sel;POINTS={};CUR=null;SLOTS=[];
  document.getElementById('diag').style.display='none';
  document.getElementById('emptyDiag').style.display='block';
  let d;
  try{d=sel==='live'?await getJSON('data.json')
                    :await getJSON(`archive/data_${sel}.json`);}
  catch(e){document.getElementById('meta').textContent=t('fail');return;}
  DATA=d;
  for(const[k,v]of Object.entries(d.sites||{}))if(v.status==='ok')POINTS['★'+k]=v;
  for(const[k,v]of Object.entries(d.stations||{}))if(v.status==='ok')POINTS[v.name]=v;
  META_Y=d.year;
  paintMeta();refreshMap();initSlots();renderSlots();fromURL();
}
function idxOf(v){return Math.round(v.hhwi)/100;}
function initMapOnce(){
  map=L.map('map').setView([36.3,127.8],7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {attribution:'© OpenStreetMap'}).addTo(map);
  mkLayer=L.layerGroup().addTo(map);
}
function refreshMap(){
  mkLayer.clearLayers();
  for(const[name,v]of Object.entries(POINTS)){
    if(v.lat==null)continue;
    L.circleMarker([v.lat,v.lon],{radius:7,color:'#fff',weight:1.5,
      fillColor:TCOL[v.traffic]||'#999',fillOpacity:.92})
      .on('click',()=>showDiag(name))
      .bindTooltip(`${name} ${idxOf(v).toFixed(2)}`).addTo(mkLayer);
  }
}
function advCopy(v){
  const A=S[LANG].adv, now=new Date(), thisYear=now.getFullYear();
  if(String(META_Y)!==String(thisYear)) return A.hist(META_Y);
  const bd=new Date(v.bloom_date+'T00:00:00');
  const dd=Math.round((bd-now)/86400000);
  if(dd>3)return A.prep(dd);
  if(dd>=-12){
    if(v.traffic==='RED')return A.red;
    if(v.traffic==='YELLOW')return A.yel;
    if(v.grade==='A'||v.grade==='B')return A.gab;
    if(v.grade==='C')return A.gc;
    return A.gde;
  }
  return A.end(META_Y);
}
function showDiag(name){
  const v=POINTS[name];if(!v)return;CUR=name;
  document.getElementById('emptyDiag').style.display='none';
  const d=document.getElementById('diag');d.style.display='block';
  const idx=idxOf(v);
  const bd=new Date(v.bloom_date+'T00:00:00');
  const isPast=String(META_Y)!==String(new Date().getFullYear());
  const [at,am]=advCopy(v);
  d.innerHTML=`
    <div class="locrow"><div class="pin">📍</div><div>
      <div class="st">${t('site')}${v.asos_km!=null?S[LANG].obsKm(v.asos_km):''} · ${META_Y}</div>
      <div class="nm">${name.replace('★','')}</div></div></div>
    <div class="bloom"><div class="lab">${isPast?t('bloomLabPast'):t('bloomLab')}</div>
      <div class="date">${S[LANG].bloom(bd)}</div></div>
    <div class="idxbox"><div class="lab">${t('idxLab')}</div>
      <div class="idxrow"><div class="val">${idx.toFixed(2)}</div>
        <div class="band" style="color:${TCOL[v.traffic]}">${S[LANG].tl[v.traffic]||''}</div></div>
      <div class="bar"><i style="width:${idx*100}%;background:${TCOL[v.traffic]}"></i></div></div>
    <div class="twin">
      <div class="gbox"><div class="lab">${t('grLab')}</div>
        <div class="v" style="color:${GCOL[v.grade]}">${v.grade}</div>
        <div style="font-size:12px;color:${GCOL[v.grade]};font-weight:700">${S[LANG].gl[v.grade]||''}</div></div>
      <div class="gbox"><div class="lab">${t('obsLab')}</div>
        <div class="v">${v.obs_days_used??'-'}</div>
        <div style="font-size:12px;color:var(--muted)">${t('days')}</div></div>
    </div>
    <div class="advice"><div class="t">${at}</div>${am}</div>`;
  if(v.lat!=null)map.setView([v.lat,v.lon],9);
}
function locateMe(){
  if(!navigator.geolocation){alert(t('noLoc'));return;}
  navigator.geolocation.getCurrentPosition(pos=>{
    const{latitude:la,longitude:lo}=pos.coords;
    let best=null,bd=1e9;
    for(const[n,v]of Object.entries(POINTS)){
      if(v.lat==null)continue;
      const d2=(v.lat-la)**2+((v.lon-lo)*0.8)**2;
      if(d2<bd){bd=d2;best=n;}
    }
    if(best)showDiag(best);
  },()=>alert(t('noLoc')));
}
function initSlots(){
  const s=document.getElementById('slotSel');
  s.innerHTML=`<option value="">${t('pick')}</option>`;
  Object.keys(POINTS).sort((a,b)=>a.localeCompare(b,'ko')).forEach(n=>{
    const o=document.createElement('option');o.value=n;o.textContent=n;s.appendChild(o);});
}
function addSlot(name){
  const n=name||document.getElementById('slotSel').value;
  if(!n||SLOTS.includes(n)||SLOTS.length>=4)return;
  SLOTS.push(n);renderSlots();
}
function rmSlot(n){SLOTS=SLOTS.filter(x=>x!==n);renderSlots();}
function renderSlots(){
  const el=document.getElementById('slotList');
  el.innerHTML=SLOTS.map(n=>{
    const v=POINTS[n];if(!v)return'';
    const bd=new Date(v.bloom_date+'T00:00:00');
    return `<div class="scard"><div class="dot" style="background:${TCOL[v.traffic]}"></div>
      <div class="n">${n.replace('★','')}</div>
      <div class="d">${S[LANG].bloom(bd)} · ${idxOf(v).toFixed(2)}</div>
      <div class="g" style="color:${GCOL[v.grade]}">${v.grade}</div>
      <button class="x" onclick="rmSlot('${n}')">✕</button></div>`;}).join('')
    ||`<div style="font-size:13px;color:var(--muted);font-family:Gowun Dodum">${t('slotHint')}</div>`;
  const u=new URL(location);SLOTS.length?u.searchParams.set('p',SLOTS.join(',')):u.searchParams.delete('p');
  history.replaceState(null,'',u);
}
function fromURL(){
  const p=new URL(location).searchParams.get('p');
  if(p)p.split(',').forEach(n=>POINTS[n]&&addSlot(n));
}
(function boot(){
  const u=new URL(location);
  LANG=u.searchParams.get('lang')==='en'?'en':'ko';
  const ys=document.getElementById('yearSel');
  const opts=[`<option value="live">${t('live')}</option>`];
  for(let y=Y1;y>=Y0;y--)opts.push(`<option value="${y}">${y}</option>`);
  ys.innerHTML=opts.join('');
  ys.onchange=()=>{const uu=new URL(location);
    ys.value==='live'?uu.searchParams.delete('y'):uu.searchParams.set('y',ys.value);
    history.replaceState(null,'',uu);loadYear(ys.value);};
  const y=u.searchParams.get('y');
  if(y){ys.value=y;YEARSEL=y;}
  paintStatic();initMapOnce();
  loadYear(YEARSEL);
})();
</script>
